<!doctype html>
<html lang="ta">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; img-src 'self' https://i.ytimg.com data:; media-src 'self' https://www.prapatti.com https://prapatti.com; style-src 'self' 'unsafe-inline'">
  <title>Slokam Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="panel" class="panel">

    <!-- full widget -->
    <header class="bar drag">
      <div class="titles">
        <div class="app-name">Slokam Player</div>
        <div class="now">
          <span id="slokaTitle" class="title">மும்மணிக்கோவை</span>
          <span id="verseLabel" class="verse-label"></span>
        </div>
      </div>
      <div class="buttons nodrag">
        <button id="btnLibrary" class="icon" title="Library (L)">☰</button>
        <button id="btnSettings" class="icon" title="Settings">⚙</button>
        <button id="btnFull" class="icon" title="Full screen (F)">⛶</button>
        <button id="btnMin" class="icon" title="Minimize (M)">–</button>
        <button id="btnClose" class="icon" title="Hide to tray (Ctrl+Alt+L brings it back)">×</button>
      </div>
    </header>

    <div id="syncBanner" class="sync-banner hidden">
      <span title="Space: mark the highlighted line as it starts · S: skip it if the recording doesn't say it here · Backspace: undo · Esc: finish">
        <b>Sync</b> <kbd>Space</kbd> line starts · <kbd>S</kbd> skip · <kbd>⌫</kbd> undo · <kbd>Esc</kbd> done
        <span id="syncNext" class="sync-next"></span></span>
      <button id="btnSkip" class="pill-btn nodrag" title="This line isn't recited here (S)">Skip</button>
      <button id="btnMark" class="pill-btn nodrag">Mark</button>
    </div>

    <main id="viewport" class="viewport nodrag">
      <ol id="lines" class="lines"></ol>
    </main>

    <footer class="controls nodrag">
      <span class="next-wrap">
        <button id="btnPrev" class="icon" title="Back to the start · press again for the previous slokam">⏮</button>
        <span id="prevPreview" class="next-preview prev hidden"><span id="prevLabel" class="next-label">Previous</span><span id="prevName" class="next-name"></span><span id="prevIast" class="next-iast"></span></span>
      </span>
      <button id="btnPlay" class="icon play" title="Play / pause (Space)">▶</button>
      <span class="next-wrap">
        <button id="btnNext" class="icon" title="Next slokam">⏭</button>
        <span id="nextPreview" class="next-preview hidden"><span id="nextLabel" class="next-label">Up next</span><span id="nextName" class="next-name"></span><span id="nextIast" class="next-iast"></span></span>
      </span>
      <button id="btnShuffle" class="icon" title="Shuffle">⇄</button>
      <span id="time" class="time">0:00</span>
      <div id="progress" class="progress" title="Drag the dot to seek"><div id="progressFill" class="fill"></div><div id="progressKnob" class="knob"></div></div>
      <span id="duration" class="time">6:56</span>
    </footer>

    <!-- minimized pill -->
    <div class="pill drag">
      <button id="pillPlay" class="icon nodrag" title="Play / pause">▶</button>
      <div id="pillText" class="pill-text"></div>
      <button id="btnRestore" class="icon nodrag" title="Expand">⤢</button>
    </div>

    <!-- settings sheet -->
    <section id="sheet" class="sheet hidden nodrag">
      <div class="sheet-head"><b>Settings</b><button id="btnSheetClose" class="icon">×</button></div>
      <label>Background <input id="optOpacity" type="range" min="0" max="0.95" step="0.05"></label>
      <label>Text size <input id="optFont" type="range" min="0.8" max="1.6" step="0.05"></label>
      <label>Timing offset <span class="row"><button id="offMinus" class="pill-btn">−0.5s</button><span id="offVal">0.0s</span><button id="offPlus" class="pill-btn">+0.5s</button></span></label>
      <label class="check" title="When off, the next slokam plays after this one ends"><input id="optLoop" type="checkbox"> Loop the recitation <span class="hint">(off: play the next slokam)</span></label>
      <label class="check"><input id="optVideo" type="checkbox"> Show video</label>
      <div class="row wrap">
        <button id="btnResume" class="pill-btn accent hidden">Resume sync</button>
        <button id="btnSync" class="pill-btn accent">Sync timings…</button>
        <button id="btnReset" class="pill-btn">Reset timings</button>
        <button id="btnQuit" class="pill-btn">Quit</button>
      </div>
      <p id="timingNote" class="note"></p>
    </section>

    <!-- library menu -->
    <section id="library" class="sheet library hidden nodrag">
      <div class="sheet-head"><b>Library</b><button id="btnLibClose" class="icon">×</button></div>
      <div id="libList" class="lib-list"></div>
    </section>

    <div id="toast" class="toast hidden"></div>
    <div id="videoBox" class="video-box"><div id="yt"></div></div>
  </div>
